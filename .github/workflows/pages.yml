# Publie le portfolio sur GitHub Pages (frankelcyrus.site) à chaque push sur main.
# Le site est généré en HTML statique (STATIC_EXPORT=true) : aucune fonction serveur n'est utilisée.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une nouvelle remplace celle en attente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Installer les dépendances
        run: bun install

      - name: Générer le site statique
        run: bun run build
        env:
          STATIC_EXPORT: "true"

      - name: Préparer le dossier publié
        run: |
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
